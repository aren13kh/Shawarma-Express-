<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shawarma Express — Մենյու</title>
<style>
:root{--bg:#fcfcf8;--card:#fff;--text:#383838;--mute:#6f6b66;--line:#e8e4dc;--acc:#701818;--accT:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1718;--card:#262021;--text:#f1ece8;--mute:#a69d98;--line:#372f30;--acc:#e07a86;--accT:#2a0a10}}
:root[data-theme="dark"]{--bg:#1b1718;--card:#262021;--text:#f1ece8;--mute:#a69d98;--line:#372f30;--acc:#e07a86;--accT:#2a0a10}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Armenian",Arial,sans-serif;font-size:16px}
header{padding:14px 16px 4px;max-width:640px;margin:0 auto}
.logo{background:#fcfcf8;border-radius:14px;display:flex;justify-content:center;padding:4px 0}
.logo img{height:92px;width:auto;display:block}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:640px;margin:0 auto}
.chips button{flex:none;padding:8px 18px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:10px;border-radius:9px;font-size:15px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--accT)}
main{padding:0 16px 40px;max-width:640px;margin:0 auto}
.note{font-size:12px;color:var(--mute);margin:-4px 0 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px;scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.card img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:15px;line-height:1.25}
.en{font-size:12px;color:var(--mute);margin-top:2px}
.ing{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.35}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.w{font-size:12px;color:var(--mute)}
.price{font-weight:800;font-size:16px;color:var(--acc)}
.ex{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ex b{color:var(--acc)}
</style>
</head>

  else if(b.getAttribute('data-m')){pork=b.getAttribute('data-m')==='p';var y=window.scrollY;render();window.scrollTo(0,y);}
  else if(b.getAttribute('data-go')){var el=document.getElementById(b.getAttribute('data-go'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
});
render();
</script>
